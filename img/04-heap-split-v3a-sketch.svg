<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 400" font-family="'Bradley Hand', 'Caveat', 'Comic Sans MS', cursive" font-size="13">
  <defs>
    <filter id="rough" x="-2%" y="-3%" width="104%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
    </filter>
    <pattern id="hatchHdrA" patternUnits="userSpaceOnUse" width="5" height="5">
      <rect width="5" height="5" fill="#fbf5e8"/>
      <line x1="0" y1="0" x2="5" y2="5" stroke="#2a2a2a" stroke-width="0.9"/>
      <line x1="5" y1="0" x2="0" y2="5" stroke="#2a2a2a" stroke-width="0.9"/>
    </pattern>
    <pattern id="hatchAllocA" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#dde9f5"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#2f5d8c" stroke-width="1.1"/>
    </pattern>
    <pattern id="hatchFreeA" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#fbf5e8"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#a08850" stroke-width="0.7"/>
    </pattern>
    <marker id="arrowheadA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2a2a2a"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#fbf5e8"/>

  <text x="296" y="30" text-anchor="middle" font-size="20" fill="#2a2a2a">splitting on malloc(16)</text>

  <!-- BEFORE caption -->
  <text x="40" y="58" font-size="14" fill="#5a5040">before — 128 B heap</text>

  <!-- BEFORE heap (y 78–162) -->
  <!-- Block A: alloc 32, inset x=42..166 -->
  <g filter="url(#rough)">
    <rect x="42"  y="78" width="32" height="84" fill="url(#hatchHdrA)"/>
    <rect x="74"  y="78" width="92" height="84" fill="url(#hatchAllocA)"/>
    <line x1="74" y1="78" x2="74" y2="162" stroke="#2a2a2a" stroke-width="1.1" stroke-dasharray="5,4" fill="none"/>
    <rect x="42"  y="78" width="124" height="84" fill="none" stroke="#2a2a2a" stroke-width="2.2"/>
  </g>
  <text x="104" y="126" text-anchor="middle" fill="#2a2a2a">alloc 32</text>

  <!-- Block B: free 64, inset x=170..422 -->
  <g filter="url(#rough)">
    <rect x="170" y="78" width="32"  height="84" fill="url(#hatchHdrA)"/>
    <rect x="202" y="78" width="188" height="84" fill="url(#hatchFreeA)"/>
    <rect x="390" y="78" width="32"  height="84" fill="url(#hatchHdrA)"/>
    <line x1="202" y1="78" x2="202" y2="162" stroke="#2a2a2a" stroke-width="1.1" stroke-dasharray="5,4" fill="none"/>
    <line x1="390" y1="78" x2="390" y2="162" stroke="#2a2a2a" stroke-width="1.1" stroke-dasharray="5,4" fill="none"/>
    <rect x="170" y="78" width="252" height="84" fill="none" stroke="#2a2a2a" stroke-width="2.2"/>
  </g>
  <text x="296" y="126" text-anchor="middle" fill="#2a2a2a">free 64</text>

  <!-- Block C: alloc 32, inset x=426..550 -->
  <g filter="url(#rough)">
    <rect x="426" y="78" width="32" height="84" fill="url(#hatchHdrA)"/>
    <rect x="458" y="78" width="92" height="84" fill="url(#hatchAllocA)"/>
    <line x1="458" y1="78" x2="458" y2="162" stroke="#2a2a2a" stroke-width="1.1" stroke-dasharray="5,4" fill="none"/>
    <rect x="426" y="78" width="124" height="84" fill="none" stroke="#2a2a2a" stroke-width="2.2"/>
  </g>
  <text x="488" y="126" text-anchor="middle" fill="#2a2a2a">alloc 32</text>

  <!-- operation arrow -->
  <g filter="url(#rough)">
    <line x1="296" y1="180" x2="296" y2="206" stroke="#2a2a2a" stroke-width="2" marker-end="url(#arrowheadA)"/>
  </g>
  <text x="310" y="200" font-size="14" fill="#2a2a2a">malloc(16) — split free 64 → alloc 32 + free 32</text>

  <!-- Pointer indicator on the new alloc block -->
  <text x="202" y="222" text-anchor="middle" font-size="14" fill="#c5302a">p = malloc(16)</text>
  <g filter="url(#rough)">
    <line x1="202" y1="226" x2="202" y2="234" stroke="#c5302a" stroke-width="1.6"/>
    <circle cx="202" cy="234" r="4" fill="#c5302a" stroke="#c5302a" stroke-width="0.5"/>
  </g>

  <!-- AFTER heap (y 234–318) -->
  <!-- Block A unchanged: alloc 32, inset x=42..166 -->
  <g filter="url(#rough)">
    <rect x="42"  y="234" width="32" height="84" fill="url(#hatchHdrA)"/>
    <rect x="74"  y="234" width="92" height="84" fill="url(#hatchAllocA)"/>
    <line x1="74" y1="234" x2="74" y2="318" stroke="#2a2a2a" stroke-width="1.1" stroke-dasharray="5,4" fill="none"/>
    <rect x="42"  y="234" width="124" height="84" fill="none" stroke="#2a2a2a" stroke-width="2.2"/>
  </g>
  <text x="104" y="282" text-anchor="middle" fill="#2a2a2a">alloc 32</text>

  <!-- New alloc 32 (cells 4–7), inset x=170..294 — CHANGED -->
  <g filter="url(#rough)">
    <rect x="170" y="234" width="32" height="84" fill="url(#hatchHdrA)"/>
    <rect x="202" y="234" width="92" height="84" fill="url(#hatchAllocA)"/>
    <line x1="202" y1="234" x2="202" y2="318" stroke="#c5302a" stroke-width="1.4" stroke-dasharray="5,4" fill="none"/>
    <rect x="170" y="234" width="124" height="84" fill="none" stroke="#c5302a" stroke-width="2.6"/>
  </g>
  <text x="232" y="282" text-anchor="middle" fill="#2a2a2a">alloc 32</text>

  <!-- New free 32 (cells 8–11), inset x=298..422 — CHANGED -->
  <g filter="url(#rough)">
    <rect x="298" y="234" width="32" height="84" fill="url(#hatchHdrA)"/>
    <rect x="330" y="234" width="60" height="84" fill="url(#hatchFreeA)"/>
    <rect x="390" y="234" width="32" height="84" fill="url(#hatchHdrA)"/>
    <line x1="330" y1="234" x2="330" y2="318" stroke="#c5302a" stroke-width="1.4" stroke-dasharray="5,4" fill="none"/>
    <line x1="390" y1="234" x2="390" y2="318" stroke="#c5302a" stroke-width="1.4" stroke-dasharray="5,4" fill="none"/>
    <rect x="298" y="234" width="124" height="84" fill="none" stroke="#c5302a" stroke-width="2.6"/>
  </g>
  <text x="360" y="282" text-anchor="middle" fill="#2a2a2a">free 32</text>

  <!-- Block C unchanged: alloc 32, inset x=426..550 -->
  <g filter="url(#rough)">
    <rect x="426" y="234" width="32" height="84" fill="url(#hatchHdrA)"/>
    <rect x="458" y="234" width="92" height="84" fill="url(#hatchAllocA)"/>
    <line x1="458" y1="234" x2="458" y2="318" stroke="#2a2a2a" stroke-width="1.1" stroke-dasharray="5,4" fill="none"/>
    <rect x="426" y="234" width="124" height="84" fill="none" stroke="#2a2a2a" stroke-width="2.2"/>
  </g>
  <text x="488" y="282" text-anchor="middle" fill="#2a2a2a">alloc 32</text>

  <!-- byte ruler -->
  <g font-size="12" fill="#5a5040">
    <line x1="40"  y1="332" x2="552" y2="332" stroke="#5a5040" stroke-width="0.6"/>
    <line x1="40"  y1="332" x2="40"  y2="338" stroke="#5a5040" stroke-width="0.6"/>
    <line x1="168" y1="332" x2="168" y2="338" stroke="#5a5040" stroke-width="0.6"/>
    <line x1="296" y1="332" x2="296" y2="338" stroke="#5a5040" stroke-width="0.6"/>
    <line x1="424" y1="332" x2="424" y2="338" stroke="#5a5040" stroke-width="0.6"/>
    <line x1="552" y1="332" x2="552" y2="338" stroke="#5a5040" stroke-width="0.6"/>
    <text x="40"  y="352" text-anchor="middle">0</text>
    <text x="168" y="352" text-anchor="middle">32</text>
    <text x="296" y="352" text-anchor="middle">64</text>
    <text x="424" y="352" text-anchor="middle">96</text>
    <text x="552" y="352" text-anchor="middle">128</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#2a2a2a">
    <rect x="40"  y="372" width="14" height="14" fill="url(#hatchHdrA)" stroke="#2a2a2a" stroke-width="0.8"/>
    <text x="60"  y="384">hdr / ftr</text>
    <rect x="140" y="372" width="14" height="14" fill="url(#hatchAllocA)" stroke="#2a2a2a" stroke-width="0.8"/>
    <text x="160" y="384">allocated</text>
    <rect x="250" y="372" width="14" height="14" fill="url(#hatchFreeA)" stroke="#2a2a2a" stroke-width="0.8"/>
    <text x="270" y="384">free</text>
    <rect x="320" y="372" width="14" height="14" fill="none" stroke="#c5302a" stroke-width="2.2"/>
    <text x="340" y="384" fill="#c5302a">changed by op</text>
    <circle cx="450" cy="379" r="4" fill="#c5302a"/>
    <text x="460" y="384" fill="#c5302a">returned ptr</text>
  </g>
</svg>
