  <script type="application/ecmascript"><![CDATA[
    (function() {
      var svg;
      var scripts = document.getElementsByTagName('script');
      for (var i = scripts.length - 1; i >= 0; i--) {
        var s = scripts[i];
        var node = s.parentNode;
        while (node) {
          if (node.tagName && node.tagName.toLowerCase() === 'svg') { svg = node; break; }
          node = node.parentNode;
        }
        if (svg) break;
      }
      if (!svg) return;
      var popup = svg.querySelector('.cursor-popup');
      if (!popup) return;
      var lineTotal  = popup.querySelector('.popup-total');
      var lineHeader = popup.querySelector('.popup-header');
      var lineStatus = popup.querySelector('.popup-status');
      var popupW = 320, popupH = 64;
      var vbW = 560, vbH = 170;

      function svgPoint(evt) {
        var pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      var blocks = svg.querySelectorAll('.block');
      for (var i = 0; i < blocks.length; i++) {
        (function(block) {
          block.addEventListener('mouseenter', function() {
            lineTotal.textContent  = block.getAttribute('data-total');
            lineHeader.textContent = block.getAttribute('data-header');
            lineStatus.textContent = block.getAttribute('data-status');
            popup.style.opacity = '1';
          });
          block.addEventListener('mousemove', function(evt) {
            var pt = svgPoint(evt);
            var dx = (pt.x + 14 + popupW > vbW) ? -popupW - 14 : 14;
            var dy = (pt.y + 14 + popupH > vbH) ? -popupH - 14 : 14;
            popup.setAttribute('transform', 'translate(' + (pt.x + dx) + ',' + (pt.y + dy) + ')');
          });
          block.addEventListener('mouseleave', function() {
            popup.style.opacity = '0';
          });
        })(blocks[i]);
      }
    })();
  ]]></script>
</svg>
