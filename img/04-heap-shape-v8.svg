<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" font-family="'Bradley Hand', 'Caveat', 'Comic Sans MS', cursive" font-size="13">
  <defs>
    <filter id="rough" x="-2%" y="-3%" width="104%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <pattern id="freeDotsV8" patternUnits="userSpaceOnUse" width="9" height="9">
      <rect width="9" height="9" fill="#fbf5e8"/>
      <circle cx="4.5" cy="4.5" r="1.1" fill="#b08850"/>
    </pattern>
    <filter id="popShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <clipPath id="cpA"><rect x="42"  y="40"  width="124" height="36" rx="4"/></clipPath>
    <clipPath id="cpB"><rect x="170" y="40"  width="252" height="36" rx="4"/></clipPath>
    <clipPath id="cpC"><rect x="426" y="40"  width="124" height="36" rx="4"/></clipPath>
    <clipPath id="cpD"><rect x="42"  y="92"  width="124" height="36" rx="4"/></clipPath>
    <clipPath id="cpE"><rect x="170" y="92"  width="252" height="36" rx="4"/></clipPath>
    <clipPath id="cpF"><rect x="426" y="92"  width="124" height="36" rx="4"/></clipPath>
  </defs>

  <style>
    .block { cursor: help; }
    .popup { opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
    .popup-default { opacity: 1; }
    .block:hover ~ .popups .popup-default { opacity: 0; }
    .bA:hover ~ .popups .popup-A,
    .bB:hover ~ .popups .popup-B,
    .bC:hover ~ .popups .popup-C,
    .bD:hover ~ .popups .popup-D,
    .bE:hover ~ .popups .popup-E,
    .bF:hover ~ .popups .popup-F { opacity: 1; }
  </style>

  <rect width="100%" height="100%" fill="#fbf5e8"/>

  <text x="280" y="22" text-anchor="middle" font-size="17" fill="#2a2a2a">heap layout — boundary tags (256 B, 2 rows)</text>

  <text x="36" y="63"  text-anchor="end" font-size="10" fill="#5a4a3a" font-family="ui-monospace, monospace">0x00</text>
  <text x="36" y="115" text-anchor="end" font-size="10" fill="#5a4a3a" font-family="ui-monospace, monospace">0x80</text>

  <!-- ============ ROW 1 ============ -->
  <!-- BLOCK A: alloc 32 -->
  <g class="block bA">
    <title>Block A — alloc 32, size_status = 0x23</title>
    <g clip-path="url(#cpA)">
      <rect x="42" y="40" width="32" height="36" fill="#2c2218"/>
      <rect x="74" y="40" width="92" height="36" fill="#3a5d8c"/>
    </g>
    <line x1="74" y1="40" x2="74" y2="76" stroke="#fbf5e8" stroke-width="1" stroke-dasharray="4,3" opacity="0.55"/>
    <g filter="url(#rough)">
      <rect x="42" y="40" width="124" height="36" rx="4" fill="none" stroke="#2c2218" stroke-width="1.6"/>
    </g>
    <text x="58" y="63" text-anchor="middle" font-size="14" fill="#fbf5e8">32</text>
  </g>

  <!-- BLOCK B: free 64 -->
  <g class="block bB">
    <title>Block B — free 64, size_status = 0x42 (footer mirrors)</title>
    <g clip-path="url(#cpB)">
      <rect x="170" y="40" width="32"  height="36" fill="#2c2218"/>
      <rect x="202" y="40" width="188" height="36" fill="url(#freeDotsV8)"/>
      <rect x="390" y="40" width="32"  height="36" fill="#2c2218"/>
    </g>
    <line x1="202" y1="40" x2="202" y2="76" stroke="#5a4a3a" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="390" y1="40" x2="390" y2="76" stroke="#5a4a3a" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6"/>
    <g filter="url(#rough)">
      <rect x="170" y="40" width="252" height="36" rx="4" fill="none" stroke="#2c2218" stroke-width="1.6"/>
    </g>
    <text x="186" y="63" text-anchor="middle" font-size="14" fill="#fbf5e8">64</text>
    <text x="406" y="63" text-anchor="middle" font-size="14" fill="#fbf5e8">64</text>
  </g>

  <!-- BLOCK C: alloc 32 -->
  <g class="block bC">
    <title>Block C — alloc 32, size_status = 0x21</title>
    <g clip-path="url(#cpC)">
      <rect x="426" y="40" width="32" height="36" fill="#2c2218"/>
      <rect x="458" y="40" width="92" height="36" fill="#3a5d8c"/>
    </g>
    <line x1="458" y1="40" x2="458" y2="76" stroke="#fbf5e8" stroke-width="1" stroke-dasharray="4,3" opacity="0.55"/>
    <g filter="url(#rough)">
      <rect x="426" y="40" width="124" height="36" rx="4" fill="none" stroke="#2c2218" stroke-width="1.6"/>
    </g>
    <text x="442" y="63" text-anchor="middle" font-size="14" fill="#fbf5e8">32</text>
  </g>

  <!-- ============ ROW 2 ============ -->
  <!-- BLOCK D: free 32 -->
  <g class="block bD">
    <title>Block D — free 32, size_status = 0x22 (footer mirrors)</title>
    <g clip-path="url(#cpD)">
      <rect x="42"  y="92" width="32" height="36" fill="#2c2218"/>
      <rect x="74"  y="92" width="60" height="36" fill="url(#freeDotsV8)"/>
      <rect x="134" y="92" width="32" height="36" fill="#2c2218"/>
    </g>
    <line x1="74"  y1="92" x2="74"  y2="128" stroke="#5a4a3a" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="134" y1="92" x2="134" y2="128" stroke="#5a4a3a" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6"/>
    <g filter="url(#rough)">
      <rect x="42" y="92" width="124" height="36" rx="4" fill="none" stroke="#2c2218" stroke-width="1.6"/>
    </g>
    <text x="58"  y="115" text-anchor="middle" font-size="14" fill="#fbf5e8">32</text>
    <text x="150" y="115" text-anchor="middle" font-size="14" fill="#fbf5e8">32</text>
  </g>

  <!-- BLOCK E: alloc 64 -->
  <g class="block bE">
    <title>Block E — alloc 64, size_status = 0x41</title>
    <g clip-path="url(#cpE)">
      <rect x="170" y="92" width="32"  height="36" fill="#2c2218"/>
      <rect x="202" y="92" width="220" height="36" fill="#3a5d8c"/>
    </g>
    <line x1="202" y1="92" x2="202" y2="128" stroke="#fbf5e8" stroke-width="1" stroke-dasharray="4,3" opacity="0.55"/>
    <g filter="url(#rough)">
      <rect x="170" y="92" width="252" height="36" rx="4" fill="none" stroke="#2c2218" stroke-width="1.6"/>
    </g>
    <text x="186" y="115" text-anchor="middle" font-size="14" fill="#fbf5e8">64</text>
  </g>

  <!-- BLOCK F: free 32 -->
  <g class="block bF">
    <title>Block F — free 32, size_status = 0x22 (footer mirrors)</title>
    <g clip-path="url(#cpF)">
      <rect x="426" y="92" width="32" height="36" fill="#2c2218"/>
      <rect x="458" y="92" width="60" height="36" fill="url(#freeDotsV8)"/>
      <rect x="518" y="92" width="32" height="36" fill="#2c2218"/>
    </g>
    <line x1="458" y1="92" x2="458" y2="128" stroke="#5a4a3a" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="518" y1="92" x2="518" y2="128" stroke="#5a4a3a" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6"/>
    <g filter="url(#rough)">
      <rect x="426" y="92" width="124" height="36" rx="4" fill="none" stroke="#2c2218" stroke-width="1.6"/>
    </g>
    <text x="442" y="115" text-anchor="middle" font-size="14" fill="#fbf5e8">32</text>
    <text x="534" y="115" text-anchor="middle" font-size="14" fill="#fbf5e8">32</text>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#2a2a2a">
    <rect x="40"  y="146" width="14" height="11" rx="2" fill="#2c2218"/>
    <text x="60"  y="155">hdr / ftr (8 B)</text>
    <rect x="170" y="146" width="14" height="11" rx="2" fill="#3a5d8c"/>
    <text x="190" y="155">alloc</text>
    <rect x="234" y="146" width="14" height="11" rx="2" fill="url(#freeDotsV8)" stroke="#5a4a3a" stroke-width="0.5"/>
    <text x="254" y="155">free</text>
  </g>

  <!-- =============== Hover popups =============== -->
  <g class="popups">
    <!-- Default hint (visible when nothing hovered) -->
    <g class="popup popup-default">
      <text x="280" y="220" text-anchor="middle" font-size="14" fill="#8a7560" font-style="italic">hover any block above to see byte-level detail</text>
    </g>

    <!-- Block A popup -->
    <g class="popup popup-A">
      <rect x="110" y="172" width="340" height="84" rx="6" fill="#fdf8e8" stroke="#2c2218" stroke-width="1.5" filter="url(#popShadow)"/>
      <text x="125" y="194" font-size="14" font-weight="bold" fill="#2a2218">Block A — alloc 32</text>
      <text x="125" y="212" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">size_status (4 B word in 8 B header slot) = 0x23</text>
      <line x1="125" y1="220" x2="435" y2="220" stroke="#5a4a3a" stroke-width="0.5" opacity="0.5"/>
      <text x="125" y="236" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">  bits 31..4 = 0x2  →  size = 32 B</text>
      <text x="125" y="250" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">  bit 1 (PB) = 1,   bit 0 (B) = 1   (busy, prev busy)</text>
    </g>

    <!-- Block B popup -->
    <g class="popup popup-B">
      <rect x="110" y="172" width="340" height="84" rx="6" fill="#fdf8e8" stroke="#2c2218" stroke-width="1.5" filter="url(#popShadow)"/>
      <text x="125" y="194" font-size="14" font-weight="bold" fill="#2a2218">Block B — free 64</text>
      <text x="125" y="212" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">size_status (4 B) = 0x42   footer at end mirrors header</text>
      <line x1="125" y1="220" x2="435" y2="220" stroke="#5a4a3a" stroke-width="0.5" opacity="0.5"/>
      <text x="125" y="236" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">  bits 31..4 = 0x4  →  size = 64 B</text>
      <text x="125" y="250" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">  bit 1 (PB) = 1,   bit 0 (B) = 0   (free, prev busy)</text>
    </g>

    <!-- Block C popup -->
    <g class="popup popup-C">
      <rect x="110" y="172" width="340" height="84" rx="6" fill="#fdf8e8" stroke="#2c2218" stroke-width="1.5" filter="url(#popShadow)"/>
      <text x="125" y="194" font-size="14" font-weight="bold" fill="#2a2218">Block C — alloc 32</text>
      <text x="125" y="212" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">size_status (4 B) = 0x21</text>
      <line x1="125" y1="220" x2="435" y2="220" stroke="#5a4a3a" stroke-width="0.5" opacity="0.5"/>
      <text x="125" y="236" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">  bits 31..4 = 0x2  →  size = 32 B</text>
      <text x="125" y="250" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">  bit 1 (PB) = 0,   bit 0 (B) = 1   (busy, prev free)</text>
    </g>

    <!-- Block D popup -->
    <g class="popup popup-D">
      <rect x="110" y="172" width="340" height="84" rx="6" fill="#fdf8e8" stroke="#2c2218" stroke-width="1.5" filter="url(#popShadow)"/>
      <text x="125" y="194" font-size="14" font-weight="bold" fill="#2a2218">Block D — free 32</text>
      <text x="125" y="212" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">size_status (4 B) = 0x22   footer at end mirrors header</text>
      <line x1="125" y1="220" x2="435" y2="220" stroke="#5a4a3a" stroke-width="0.5" opacity="0.5"/>
      <text x="125" y="236" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">  bits 31..4 = 0x2  →  size = 32 B</text>
      <text x="125" y="250" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">  bit 1 (PB) = 1,   bit 0 (B) = 0   (free, prev busy)</text>
    </g>

    <!-- Block E popup -->
    <g class="popup popup-E">
      <rect x="110" y="172" width="340" height="84" rx="6" fill="#fdf8e8" stroke="#2c2218" stroke-width="1.5" filter="url(#popShadow)"/>
      <text x="125" y="194" font-size="14" font-weight="bold" fill="#2a2218">Block E — alloc 64</text>
      <text x="125" y="212" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">size_status (4 B) = 0x41</text>
      <line x1="125" y1="220" x2="435" y2="220" stroke="#5a4a3a" stroke-width="0.5" opacity="0.5"/>
      <text x="125" y="236" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">  bits 31..4 = 0x4  →  size = 64 B</text>
      <text x="125" y="250" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">  bit 1 (PB) = 0,   bit 0 (B) = 1   (busy, prev free)</text>
    </g>

    <!-- Block F popup -->
    <g class="popup popup-F">
      <rect x="110" y="172" width="340" height="84" rx="6" fill="#fdf8e8" stroke="#2c2218" stroke-width="1.5" filter="url(#popShadow)"/>
      <text x="125" y="194" font-size="14" font-weight="bold" fill="#2a2218">Block F — free 32</text>
      <text x="125" y="212" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">size_status (4 B) = 0x22   footer at end mirrors header</text>
      <line x1="125" y1="220" x2="435" y2="220" stroke="#5a4a3a" stroke-width="0.5" opacity="0.5"/>
      <text x="125" y="236" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">  bits 31..4 = 0x2  →  size = 32 B</text>
      <text x="125" y="250" font-size="11" font-family="ui-monospace, monospace" fill="#3a302a">  bit 1 (PB) = 1,   bit 0 (B) = 0   (free, prev busy)</text>
    </g>
  </g>
</svg>
